# /profile/_metadata.yml
format:
  html:
    include-before-body:
      text: |
        <div class="profile-header">
          <h2>{{< meta profile.name >}}</h2>
          <ul>
            <li><a href="mailto:{{< meta profile.email >}}">email</a></li>
            <li>Location: {{< meta profile.location >}}</li>
          </ul>
        </div>
        <hr>